<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#121212">
  <title>SesamePortal — Offline</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f8f6f1; color: #171717; font: 16px/1.6 system-ui, sans-serif; }
    main { max-width: 28rem; padding: 2rem; }
    h1 { font-size: 1.6rem; }
    button { font: inherit; padding: .7rem 1.2rem; background: #171717; color: white; border: 0; border-radius: .7rem; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <strong>SesamePortal</strong>
    <h1 id="title">Нет соединения с порталом</h1>
    <p id="message">Для просмотра камер нужен интернет и доступ к серверу. Проверьте подключение и попробуйте снова.</p>
    <button id="retry" type="button">Повторить</button>
  </main>
  <script>
    if (!navigator.language.toLowerCase().startsWith('ru')) {
      document.documentElement.lang = 'en';
      document.getElementById('title').textContent = 'Cannot connect to the portal';
      document.getElementById('message').textContent = 'Viewing cameras requires an internet connection and access to the server. Check your connection and try again.';
      document.getElementById('retry').textContent = 'Try again';
    }
    const retry = () => location.pathname === '/offline.html' ? location.assign('/') : location.reload();
    document.getElementById('retry').addEventListener('click', retry);
    window.addEventListener('online', retry);
  </script>
</body>
</html>
